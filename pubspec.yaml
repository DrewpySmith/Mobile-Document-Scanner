name: scanmind
description: A premium, production-ready document scanner & translator app.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.1.4
  
  # Local Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  
  # System Integrations
  cunning_document_scanner: ^1.1.0
  google_mlkit_text_recognition: ^0.12.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  
  # Network & Services
  dio: ^5.4.3+1
  pdf: ^3.10.8
  intl: ^0.19.0
  
  # Styling & Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  isar_generator: ^3.1.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  
  # ScanMind Brand Assets (Placeholder config, but can be loaded dynamically)
  assets:
    - assets/images/
